<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Project Hub owner dashboard.">
  <title>Shadow · Project Hub</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="dashboard">
  <a href="#dashboard-main" class="skip-link">Skip to dashboard content</a>

  <div class="dashboard-layout">
    <aside id="sidebar" class="sidebar" aria-label="Dashboard navigation"></aside>

    <main id="dashboard-main" class="dashboard-main">
      <header class="dashboard-header">
        <div class="dashboard-header-inner">
          <button
            id="sidebar-toggle"
            class="btn btn-ghost sidebar-toggle"
            aria-label="Toggle sidebar"
            aria-expanded="false"
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M3 12h18M3 6h18M3 18h18"></path>
            </svg>
          </button>
          <div>
            <h1 id="page-title" class="page-title">Overview</h1>
            <p id="page-subtitle" class="page-subtitle">Welcome back, shadow.</p>
          </div>
        </div>
        <button id="add-project-btn" class="btn btn-primary">+ New project</button>
      </header>

      <section id="dashboard-content" class="dashboard-content" aria-live="polite"></section>
    </main>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root" class="modal-root"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
