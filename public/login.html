<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Owner login for Project Hub.">
  <title>Shadow · Project Hub</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="login">
  <a href="#auth-card" class="skip-link">Skip to login form</a>

  <main class="auth-page">
    <div id="auth-card" class="auth-card" role="form" aria-labelledby="auth-title">
      <div class="auth-brand">
        <div class="brand-mark" aria-hidden="true">PH</div>
        <h1 id="auth-title" class="auth-title">Shadow</h1>
        <p class="auth-subtitle">Sign in to manage your projects.</p>
      </div>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            class="form-input"
            placeholder="owner@example.com"
            autocomplete="email"
            required
            aria-describedby="email-error"
          />
          <p id="email-error" class="form-error" aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-wrap">
            <input
              id="password"
              name="password"
              type="password"
              class="form-input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              minlength="6"
              aria-describedby="password-error"
            />
            <button
              type="button"
              id="toggle-password"
              class="password-toggle"
              aria-label="Show password"
              aria-pressed="false"
            >
              Show
            </button>
          </div>
          <p id="password-error" class="form-error" aria-live="polite"></p>
        </div>

        <div class="form-options">
          <a href="#" class="text-link" id="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" id="login-submit" class="btn btn-primary btn-block">
          <span class="btn-text">Sign in</span>
          <span class="spinner btn-spinner" aria-hidden="true"></span>
        </button>

        <p id="login-error" class="form-error form-error-center" aria-live="polite"></p>
      </form>

      <p class="auth-footer">
        <a href="index.html" class="text-link">← Back to public page</a>
      </p>
    </div>
  </main>

  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
